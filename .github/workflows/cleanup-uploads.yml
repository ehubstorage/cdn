name: Auto Cleanup Uploads
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Delete all files in uploads/
        run: |
          shopt -s globstar nullglob
          FILES=$(find uploads -type f ! -name '.gitkeep' 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "✅ uploads/ is already empty!"
            exit 0
          fi

          COUNT=$(echo "$FILES" | wc -l)
          echo "🗑️ Deleting $COUNT files..."

          find uploads -type f ! -name '.gitkeep' -delete

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A uploads/
          git commit -m "chore: cleanup uploads ($COUNT files) [skip ci]"
          git push

          echo "✅ Cleanup complete!"
